name: Build Chrome Extension Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create extension ZIP
      run: |
        cd ${{ github.workspace }}
        zip -r chrome-extension-meet-translator.zip \
          manifest.json \
          popup.html \
          popup.js \
          background.js \
          content.js \
          icons/ \
          -x ".*"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name }} - Google Meet Voice Translator
        body: |
          ## ${{ github.ref_name }} - Google Meet Voice Translator

          ### Instalación
          1. Descarga el `.zip` adjunto
          2. Descomprime la carpeta
          3. Ve a `chrome://extensions/`
          4. Activa "Modo de desarrollador"
          5. Click en "Cargar descomprimida" y selecciona la carpeta

          ### Requisitos
          - API Key de OpenRouter (obtener en https://openrouter.ai)
          - Reemplazar `YOUR_API_KEY_HERE` en `content.js` con tu key
        files: chrome-extension-meet-translator.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
